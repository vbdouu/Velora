<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connexion à votre espace Velora — accédez à vos commandes, favoris et profil.">
  <title>Connexion — Velora</title>
  <link rel="icon" type="image/svg+xml" href="/images/defaults/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/toast.js"></script>
  <script defer src="/js/login.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <div class="auth-layout">

    <!-- ── Left: Full-Bleed Jewelry Photo ── -->
    <div class="auth-image-panel">
      <a class="auth-panel-brand" href="/index.html">VELORA<span>.</span></a>
      <img
        class="auth-image"
        src="https://images.unsplash.com/photo-1602173574767-37ac01994b2a?w=1400&auto=format&fit=crop&q=90&crop=focalpoint&fp-y=0.45"
        alt="Bijoux Velora"
        loading="eager"
      >
      <div class="auth-image-overlay">
        <div class="auth-gold-rule"></div>
        <div class="auth-image-quote">
          <blockquote>
            La beauté d'un bijou réside dans la façon dont il raconte votre histoire.
          </blockquote>
          <cite>Velora</cite>
        </div>
      </div>
    </div>

    <!-- ── Right: Dark Premium Form (Exact 2-Column Grid as Register) ── -->
    <div class="auth-form-panel">
      <div class="auth-form-inner">

        <div class="auth-anim-1">
          <p class="auth-eyebrow">Espace client</p>
          <h1 class="auth-heading">Se connecter</h1>
          <p class="auth-subheading">Connectez-vous pour retrouver vos commandes et favoris.</p>
        </div>

        <div class="auth-alert" id="login-messages"></div>

        <form class="auth-form auth-anim-2" id="login-form" novalidate>

          <div class="auth-form-row">
            <div class="auth-field">
              <label class="auth-field-label" for="email">Adresse e-mail</label>
              <div class="auth-field-input-wrap">
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="votre@email.com">
                <span class="auth-field-line"></span>
              </div>
            </div>

            <div class="auth-field">
              <label class="auth-field-label" for="password">Mot de passe</label>
              <div class="auth-field-input-wrap">
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                <button type="button" class="auth-toggle-pwd" id="toggle-pwd-btn" aria-label="Afficher le mot de passe">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <span class="auth-field-line"></span>
              </div>
            </div>
          </div>

          <div class="auth-anim-3">
            <button type="submit" class="auth-submit-btn">Se connecter</button>
          </div>

          <div class="auth-security-note">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>Connexion sécurisée SSL (256-bit)</span>
          </div>

        </form>

        <div class="auth-footer-link auth-anim-4">
          Pas encore de compte ? <a href="/register.html">Créer un compte</a>
        </div>

      </div>
    </div>

  </div>

  <div id="site-footer" style="display: none;"></div>
</body>
</html>
