<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — Velora</title>
  <meta name="description" content="La page que vous cherchez est introuvable. Retournez à l'accueil Velora.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/images/defaults/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page-404 {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px;
    }

    .page-404-code {
      font-family: var(--font-display, 'Playfair Display', serif);
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--gold, #c8a96e), var(--gold-dark, #a07840));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      letter-spacing: -0.03em;
    }

    .page-404-title {
      font-family: var(--font-display, 'Playfair Display', serif);
      font-size: clamp(1.3rem, 4vw, 2rem);
      color: var(--ink, #1a1a1a);
      margin-bottom: 12px;
    }

    .page-404-desc {
      font-size: 1rem;
      color: var(--muted, #888);
      max-width: 420px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .page-404-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .page-404-divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, var(--gold, #c8a96e), transparent);
      border-radius: 2px;
      margin: 0 auto 28px;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="page-main">
    <div class="container">
      <div class="page-404">
        <div class="page-404-code" aria-hidden="true">404</div>
        <h1 class="page-404-title">Page introuvable</h1>
        <div class="page-404-divider"></div>
        <p class="page-404-desc">
          La page que vous cherchez n'existe pas ou a été déplacée.<br>
          Pas d'inquiétude, nos bijoux vous attendent toujours.
        </p>
        <div class="page-404-actions">
          <a href="/index.html" class="btn primary">Retour à l'accueil</a>
          <a href="/shop.html" class="btn outline">Voir la boutique</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script defer src="/js/api.js"></script>
  <script defer src="/js/auth.js"></script>
</body>
</html>
