<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Velora — Explorez notre collection complète de bijoux élégants : bagues, colliers, bracelets et boucles d'oreilles.">
  <title>Boutique — Velora</title>
  <link rel="icon" type="image/svg+xml" href="/images/defaults/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/toast.js"></script>
  <script defer src="/js/quickview.js"></script>
  <script defer src="/js/shop.js"></script>
</head>
<body data-active="shop">
  <div id="site-header"></div>

  <main class="page-main">

    <!-- Shop Header (Compact & Editorial) -->
    <div class="container shop-header">
      <div class="shop-header-row">
        <h1 class="shop-title" id="shop-main-title">Toute la collection</h1>
        <p class="shop-count" id="products-count"></p>
      </div>
    </div>

    <!-- Shop Layout -->
    <div class="container">
      <div class="shop-layout">

        <!-- Sidebar Filters -->
        <aside class="shop-sidebar" aria-label="Filtres produits">

          <div class="shop-sidebar-section">
            <p class="shop-sidebar-title">Catégories</p>
            <div id="category-filters" role="group" aria-label="Filtrer par catégorie">
              <div class="loading-state" style="padding: 16px 0; font-size: 0.85rem;">Chargement…</div>
            </div>
          </div>

          <div class="shop-sidebar-section">
            <p class="shop-sidebar-title">Trier par</p>
            <div id="sort-options" role="group" aria-label="Trier les produits">
              <button type="button" class="filter-btn active" data-sort="">Par défaut</button>
              <button type="button" class="filter-btn" data-sort="price_asc">Prix croissant</button>
              <button type="button" class="filter-btn" data-sort="price_desc">Prix décroissant</button>
              <button type="button" class="filter-btn" data-sort="newest">Nouveautés</button>
            </div>
          </div>

        </aside>

        <!-- Products Area -->
        <div class="dashboard-content">
          <div id="shop-messages"></div>
          <div class="products-grid" id="shop-products">
            <div class="loading-state" style="grid-column: 1 / -1;">Chargement des bijoux…</div>
          </div>
          <div class="shop-pagination-wrap" id="shop-pagination" style="display:none;">
            <button type="button" class="btn outline shop-load-more-btn" id="btn-load-more">
              <span>Afficher plus de créations</span>
            </button>
            <p class="shop-pagination-info" id="pagination-info"></p>
          </div>
        </div>

      </div>
    </div>

  </main>

  <div id="site-footer"></div>
</body>
</html>
