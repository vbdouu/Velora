<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Découvrez nos bijoux tendance et accessibles, livrés partout en Algérie. Paiement à la livraison.">
  <meta name="theme-color" content="#FDFCF8">
  <title>Bijou — Velora</title>
  <link rel="icon" type="image/svg+xml" href="/images/defaults/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="/js/api.js"></script>
  <script defer src="/js/auth.js"></script>
  <script defer src="/js/toast.js"></script>
  <script defer src="/js/product.js"></script>
</head>
<body data-active="shop">
  <div id="site-header"></div>

  <main class="page-main">
    <div class="container">

      <!-- Breadcrumb injected by product.js -->
      <nav class="breadcrumb" id="product-breadcrumb" aria-label="Fil d'Ariane">
        <a href="/index.html">Accueil</a>
        <span class="breadcrumb-sep" aria-hidden="true">◆</span>
        <a href="/shop.html">Boutique</a>
        <span class="breadcrumb-sep" aria-hidden="true">◆</span>
        <span id="product-breadcrumb-name">Produit</span>
      </nav>

      <div id="product-messages"></div>

      <!-- Product layout injected by product.js -->
      <div id="product-container" class="product-layout">
        <div class="loading-state full" style="grid-column: 1 / -1;">Chargement du bijou…</div>
      </div>

    </div>

    <!-- Produits similaires -->
    <section class="section section-cream" id="related-section" aria-labelledby="related-heading" hidden>
      <div class="container">
        <div class="section-heading-between">
          <div>
            <span class="eyebrow">Vous aimerez aussi</span>
            <h2 id="related-heading">Dans la même collection</h2>
          </div>
          <a class="link-underline" href="/shop.html">Voir tout &rarr;</a>
        </div>
        <div class="products-grid" id="related-products">
          <!-- Loaded via product.js -->
        </div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
</body>
</html>
